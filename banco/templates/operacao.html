<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>{{ titulo }}</h1>

        <form method="POST" action="{{ url_for(acao) }}">
            <label for="numero">Número da conta:</label>
            <input
                type="number"
                id="numero"
                name="numero"
                min="1"
                placeholder="Digite o número da conta"
                required
            >

            <label for="valor">Valor em reais (R$):</label>
            <input
                type="number"
                id="valor"
                name="valor"
                min="0.01"
                step="0.01"
                placeholder="0,00"
                required
            >

            <button type="submit">Confirmar {{ titulo.lower() }}</button>
        </form>

        <a class="voltar" href="{{ url_for('menu') }}">
            Cancelar e voltar ao menu
        </a>
    </div>

</body>
</html>
