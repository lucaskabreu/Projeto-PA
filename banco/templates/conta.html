
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Conta</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Cadastrar Conta</h1>

        <form method="POST" action="{{ url_for('cadastrar_conta') }}">

            <label for="nome_cliente">Nome do cliente:</label>
            <input
                type="text"
                id="nome_cliente"
                name="nome_cliente"
                placeholder="Nome do cliente cadastrado"
                required
            >

            <button type="submit">Criar conta</button>
        </form>

        <a class="voltar" href="{{ url_for('menu') }}">
            Cancelar e voltar ao menu
        </a>
    </div>

</body>
</html>
