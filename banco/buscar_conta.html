<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Buscar Conta</title>
</head>
<body>
    <h1>Procurar Conta pelo Número</h1>
    <form action="/buscar-conta" method="POST">
        <label for="numero">Número da conta:</label><br>
        <input type="number" id="numero" name="numero" required>
        <br><br>
        <button type="submit">Buscar Conta</button>
        <a href="/">Voltar ao Menu</a>
    </form>
</body>
</html>
